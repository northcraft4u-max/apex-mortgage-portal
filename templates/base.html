<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Apex Lending Group | Ontario Mortgage & Renewal Advisory{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}" />
</head>
<body>
  <div id="spaLoaderBar"></div>

  <nav class="navbar navbar-expand-xl navbar-dark navbar-apex sticky-top py-3">
    <div class="container">
      <a class="navbar-brand brand-font fw-bold d-flex align-items-center gap-2" data-spa href="{{ url_for('home') }}">
        <span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:linear-gradient(135deg,#f59e0b,#10b981);"></span>
        <span>Apex <span class="text-warning">Lending Group</span></span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <div class="navbar-nav ms-auto align-items-xl-center gap-1 mt-2 mt-xl-0">
          <a class="nav-pill {% if active_page == 'home' %}active{% endif %}" data-spa href="{{ url_for('home') }}">Home</a>
          <a class="nav-pill {% if active_page == 'programs' %}active{% endif %}" data-spa href="{{ url_for('programs') }}">Programs & Rates</a>
          <a class="nav-pill {% if active_page == 'calculators' %}active{% endif %}" data-spa href="{{ url_for('calculators') }}">CMHC & FX Calc</a>
          <a class="nav-pill {% if active_page == 'readiness' %}active{% endif %}" data-spa href="{{ url_for('readiness') }}">Approval Tracker</a>
          <a class="nav-pill {% if active_page == 'letter_builder' %}active{% endif %}" data-spa href="{{ url_for('letter_builder') }}">Script Builder</a>
          <a class="nav-pill {% if active_page == 'vault' %}active{% endif %}" data-spa href="{{ url_for('vault') }}">Doc Vault & Shredder</a>
          <a class="btn btn-gold btn-sm ms-xl-2" data-spa href="{{ url_for('book') }}">Pre-Approve Now</a>
        </div>
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="py-4 mt-5">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3 small text-secondary">
      <div>
        <strong class="text-light">Apex Lending Group (FSRA Licensed Brokerage Demo)</strong> • Brampton, Mississauga & GTA
      </div>
      <div class="d-flex flex-wrap gap-3">
        <a data-spa href="{{ url_for('programs') }}" class="text-secondary text-decoration-none">Programs</a>
        <a data-spa href="{{ url_for('calculators') }}" class="text-secondary text-decoration-none">Calculators</a>
        <a data-spa href="{{ url_for('readiness') }}" class="text-secondary text-decoration-none">Readiness</a>
        <a data-spa href="{{ url_for('vault') }}" class="text-secondary text-decoration-none">Client Vault</a>
        <a data-spa href="{{ url_for('book') }}" class="text-secondary text-decoration-none">Book Call</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
